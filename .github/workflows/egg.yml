on: 
  push:
  workflow_dispatch:

jobs:
  ubuntu-test:
    runs-on: ubuntu-latest
    env:
      name: xiaoming
    steps:
    - name: '拉取代码'
      uses: actions/checkout@v4 
    - name: '学习'
      run: pwd
    - name: '当前目录文件'
      run: ls
    - name: '输出名字'
      run: echo "Hello, $name!"
    - name: '检查网页文件'
      run: test -f index.html
    - name: '准备发布文件'
      run: |
        mkdir -p public
        cp index.html public/
        ls public
    - name: '上传网页文件'
      uses: actions/upload-pages-artifact@v4
      with:
        path: public
  deploy:
    needs: ubuntu-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: '部署网页'
      uses: actions/deploy-pages@v4
  win-test:
    needs: ubuntu-test
    runs-on: windows-latest
    steps:
    - run: node --version